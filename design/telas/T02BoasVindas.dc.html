<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boas-vindas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F7F7FB}
a{color:#5B5BD6}
.press{transition:transform 180ms ease-out,background-color 180ms ease-out}.press:active{transform:scale(.97);background:#4747B8}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fade 220ms ease-out both}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7FB; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #1B1B1F">
  <div style="height: 104px; box-sizing: border-box; padding: 48px 8px 0 20px; display: flex; align-items: center; justify-content: flex-end">
    <a href="T03Conta.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; font-weight: 600; font-size: 16px; text-decoration: none; color: #5B5BD6">Pular</a>
  </div>

  <div style="height: 300px; display: flex; align-items: center; justify-content: center">
    <sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
      <svg class="fade" width="300" height="260" viewBox="0 0 300 260" aria-hidden="true">
        <circle cx="150" cy="130" r="112" fill="#EEEEFC"></circle>
        <circle cx="150" cy="130" r="72" fill="#FFFFFF"></circle>
        <circle cx="150" cy="130" r="36" fill="#5B5BD6"></circle>
        <circle cx="244" cy="54" r="18" fill="#FFB84D"></circle>
        <circle cx="62" cy="206" r="12" fill="#2FBF8F"></circle>
      </svg>
    </sc-if>
    <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
      <svg class="fade" width="300" height="260" viewBox="0 0 300 260" aria-hidden="true">
        <rect x="38" y="40" width="170" height="104" rx="28" fill="#5B5BD6"></rect>
        <path d="M70 144v34l32-34z" fill="#5B5BD6"></path>
        <rect x="112" y="118" width="150" height="92" rx="28" fill="#E3F7F0"></rect>
        <path d="m160 164 16 16 34-34" stroke="#2FBF8F" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="76" cy="92" r="8" fill="#FFFFFF"></circle><circle cx="104" cy="92" r="8" fill="#FFFFFF"></circle><circle cx="132" cy="92" r="8" fill="#FFFFFF"></circle>
      </svg>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <svg class="fade" width="300" height="260" viewBox="0 0 300 260" aria-hidden="true">
        <rect x="70" y="30" width="160" height="200" rx="28" fill="#FFFFFF" stroke="#E8E8F0" stroke-width="2"></rect>
        <circle cx="150" cy="96" r="34" fill="#EEEEFC"></circle>
        <circle cx="150" cy="90" r="14" fill="#5B5BD6"></circle>
        <rect x="104" y="146" width="92" height="12" rx="6" fill="#5B5BD6"></rect>
        <rect x="116" y="170" width="68" height="10" rx="5" fill="#E8E8F0"></rect>
        <circle cx="238" cy="52" r="26" fill="#FFB84D"></circle>
        <path d="m228 52 7 7 14-14" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </sc-if>
  </div>

  <div style="flex-grow: 1; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; line-height: 34px; letter-spacing: -0.3px">{{slide.title}}</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #6B6B76">{{slide.text}}</p>
  </div>

  <div style="padding: 0 20px 40px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; gap: 8px; justify-content: center" aria-label="{{dotsLabel}}">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <span style="height: 8px; width: {{d.w}}; border-radius: 999px; background: {{d.bg}}; transition: width 200ms ease-out"></span>
      </sc-for>
    </div>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button class="press" onClick="{{next}}" style="height: 52px; width: 100%; border: 0; border-radius: 14px; background: #5B5BD6; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Continuar</button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
      <a class="press" href="T03Conta.dc.html" style="height: 52px; width: 100%; border-radius: 14px; background: #5B5BD6; color: #FFFFFF; font: 600 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Começar</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const slides = [
      { title: 'Entrevista não precisa dar medo', text: 'Treine com calma, no seu ritmo, quantas vezes quiser.' },
      { title: 'Feedback que ajuda de verdade', text: 'Saiba o que está bom e o que melhorar, com exemplos prontos.' },
      { title: 'Seu perfil pronto para ser notado', text: 'Receba um relatório do seu LinkedIn e dicas para o mercado de trabalho.' }
    ];
    const i = this.state.i;
    return {
      slide: slides[i],
      s0: i === 0, s1: i === 1, s2: i === 2,
      isLast: i === 2, notLast: i !== 2,
      dotsLabel: 'Passo ' + (i + 1) + ' de 3',
      dots: slides.map((_, k) => ({ w: k === i ? '24px' : '8px', bg: k === i ? '#5B5BD6' : '#D6D6E4' })),
      next: () => this.setState({ i: Math.min(2, i + 1) })
    };
  }
}
</script>
</body>
</html>
