<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carregando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7FB}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1400ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div aria-busy="true" aria-label="Carregando" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7FB; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div class="pulse" style="flex-grow: 1; padding: 64px 20px 24px; display: flex; flex-direction: column; gap: 16px">

    <sc-if value="{{home}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="height: 30px; width: 55%; border-radius: 10px; background: #E8E8F0"></div>
        <div style="height: 16px; width: 80%; border-radius: 8px; background: #EFEFF5"></div>
        <div style="height: 120px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; gap: 12px; align-items: center"><div style="width: 40px; height: 40px; border-radius: 999px; background: #EFEFF5"></div><div style="height: 16px; width: 45%; border-radius: 8px; background: #E8E8F0"></div></div>
          <div style="display: flex; gap: 14px"><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div><div style="width: 28px; height: 28px; border-radius: 999px; background: #EFEFF5"></div></div>
        </div>
        <div style="height: 170px; border-radius: 20px; background: #EEEEFC; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
          <div style="height: 12px; width: 30%; border-radius: 8px; background: #DDDDF7"></div>
          <div style="height: 20px; width: 75%; border-radius: 8px; background: #DDDDF7"></div>
          <div style="margin-top: auto; height: 52px; border-radius: 14px; background: #DDDDF7"></div>
        </div>
        <div style="height: 80px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0"></div>
        <div style="height: 150px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0"></div>
      </div>
    </sc-if>

    <sc-if value="{{dicas}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="height: 28px; width: 30%; border-radius: 10px; background: #E8E8F0"></div>
        <div style="height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8E8F0"></div>
        <div style="display: flex; gap: 8px"><div style="height: 40px; width: 72px; border-radius: 999px; background: #E8E8F0"></div><div style="height: 40px; width: 96px; border-radius: 999px; background: #EFEFF5"></div><div style="height: 40px; width: 100px; border-radius: 999px; background: #EFEFF5"></div><div style="height: 40px; width: 80px; border-radius: 999px; background: #EFEFF5"></div></div>
        <div style="display: flex; gap: 12px"><div style="flex-shrink: 0; width: 240px; height: 116px; border-radius: 20px; background: #EEEEFC"></div><div style="flex-shrink: 0; width: 240px; height: 116px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0"></div></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div style="height: 84px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0; padding: 18px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><div style="height: 14px; width: 78%; border-radius: 8px; background: #E8E8F0"></div><div style="height: 12px; width: 36%; border-radius: 8px; background: #EFEFF5"></div></div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{relatorio}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 18px; align-items: stretch">
        <div style="height: 20px; width: 50%; border-radius: 8px; background: #E8E8F0"></div>
        <div style="align-self: center; width: 150px; height: 150px; border-radius: 999px; border: 14px solid #E8E8F0; box-sizing: border-box; margin-top: 8px"></div>
        <div style="align-self: center; height: 22px; width: 70%; border-radius: 8px; background: #E8E8F0"></div>
        <div style="align-self: center; height: 14px; width: 85%; border-radius: 8px; background: #EFEFF5"></div>
        <div style="height: 190px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px"><div style="height: 16px; width: 40%; border-radius: 8px; background: #E8E8F0"></div><div style="height: 14px; width: 90%; border-radius: 8px; background: #EFEFF5"></div><div style="height: 14px; width: 80%; border-radius: 8px; background: #EFEFF5"></div><div style="height: 14px; width: 85%; border-radius: 8px; background: #EFEFF5"></div></div>
        <div style="height: 60px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0"></div>
        <div style="height: 60px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8F0"></div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tela":{"editor":"enum","options":["home","dicas","relatorio"],"default":"home"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tela ?? 'home';
    return { home: t === 'home', dicas: t === 'dicas', relatorio: t === 'relatorio', rows: [1, 2, 3, 4] };
  }
}
</script>
</body>
</html>
