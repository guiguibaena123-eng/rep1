<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Simulação em andamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.press{transition:transform 180ms ease-out}.press:active{transform:scale(.97)}
textarea:focus{outline:none}
:focus-visible{outline:2px solid #7B7BEA;outline-offset:2px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.up{animation:up 220ms ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade 200ms ease-out both}
@media (prefers-reduced-motion: reduce){.up,.fade{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: {{c.text}}; overflow: hidden">
  <div style="padding: 52px 20px 0 8px; display: flex; align-items: center; gap: 8px">
    <button onClick="{{openExit}}" aria-label="Fechar simulação" style="width: 48px; height: 48px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; line-height: 20px; font-weight: 600; color: {{c.text2}}">Pergunta {{num}} de 5</div>
      <div role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="{{num}}" aria-label="Pergunta {{num}} de 5" style="height: 8px; border-radius: 999px; background: {{c.track}}; overflow: hidden">
        <div style="height: 8px; width: {{pct}}; border-radius: 999px; background: {{c.primary}}; transition: width 250ms ease-out"></div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px; min-height: 0">
    <div style="padding: 24px 20px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.4px; color: {{c.primaryInk}}">ATENDIMENTO · PRIMEIRO EMPREGO</div>
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 22px; line-height: 30px">{{q.text}}</h1>
    </div>

    <sc-if value="{{showTip}}" hint-placeholder-val="{{ false }}">
      <div class="fade" role="note" style="padding: 14px 16px; border-radius: 14px; background: {{c.primarySoft}}; display: flex; gap: 10px; font-size: 14px; line-height: 20px; color: {{c.text}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.primaryInk}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
        <span>{{q.tip}}</span>
      </div>
    </sc-if>

    <div style="position: relative; flex-grow: 1; min-height: 0; display: flex">
      <label for="resposta" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Sua resposta</label>
      <textarea id="resposta" value="{{answer}}" onChange="{{onType}}" onFocus="{{onFocus}}" onBlur="{{onBlur}}" maxlength="1000" placeholder="Escreva sua resposta com calma. Não precisa ser perfeita." style="flex-grow: 1; width: 100%; box-sizing: border-box; padding: 16px 16px 36px; border: {{fieldBorder}}; border-radius: 14px; background: {{c.surface}}; color: {{c.text}}; font: 400 16px/24px Inter, sans-serif; resize: none"></textarea>
      <span style="position: absolute; right: 14px; bottom: 12px; font-size: 12px; line-height: 16px; color: {{c.text2}}">{{len}}/1000</span>
    </div>
  </div>

  <div style="padding: 16px 20px 32px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <button class="press" onClick="{{toggleTip}}" aria-pressed="{{showTip}}" style="height: 52px; border: 0; border-radius: 14px; background: {{c.primarySoft}}; color: {{c.primaryInk}}; font: 600 16px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>Dica
    </button>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button class="press" onClick="{{send}}" disabled="{{empty}}" style="height: 52px; border: 0; border-radius: 14px; background: {{sendBg}}; color: {{sendColor}}; font: 600 16px Inter, sans-serif; cursor: pointer">Enviar resposta</button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
      <a class="press" href="T08Gerando.dc.html" style="height: 52px; border-radius: 14px; background: {{c.primary}}; color: {{c.onPrimary}}; font: 600 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Enviar e finalizar</a>
    </sc-if>
  </div>

  <sc-if value="{{exit}}" hint-placeholder-val="{{ false }}">
    <div class="fade" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{c.scrim}}; display: flex; flex-direction: column; justify-content: flex-end">
      <div class="up" role="dialog" aria-modal="true" aria-labelledby="sair-t" style="background: {{c.surface}}; border-radius: 28px 28px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -4px 16px rgba(0,0,0,0.06)">
        <div style="width: 40px; height: 4px; border-radius: 999px; background: {{c.border}}; align-self: center"></div>
        <div id="sair-t" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; line-height: 26px; padding-top: 8px">Sair da simulação?</div>
        <div style="font-size: 16px; line-height: 24px; color: {{c.text2}}">Se sair agora, suas respostas não serão salvas. Você pode continuar de onde parou.</div>
        <button class="press" onClick="{{closeExit}}" style="height: 52px; border: 0; border-radius: 14px; background: {{c.primary}}; color: {{c.onPrimary}}; font: 600 16px Inter, sans-serif; cursor: pointer; margin-top: 8px">Continuar</button>
        <a href="T06NovaSimulacao.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; color: {{c.primaryInk}}; font: 600 16px Inter, sans-serif; text-decoration: none">Sair sem salvar</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      i: 1, tip: false, exit: false, focus: false,
      answers: ['Sou a Ana, tenho 19 anos e estou terminando o técnico em Administração.', 'Na feira de profissões da escola, um pai não achava a sala da palestra. Eu', '', '', '']
    };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = { bg: '#F7F7FB', surface: '#FFFFFF', border: '#E8E8F0', text: '#1B1B1F', text2: '#6B6B76', primary: '#5B5BD6', onPrimary: '#FFFFFF', primaryInk: '#4747B8', primarySoft: '#EEEEFC', track: '#E8E8F0', scrim: 'rgba(27,27,31,0.4)', off: '#E8E8F0', offText: '#A3A3AD' };
    const D = { bg: '#111116', surface: '#1B1B22', border: '#2A2A34', text: '#F2F2F5', text2: '#A0A0AD', primary: '#7B7BEA', onPrimary: '#111116', primaryInk: '#A9A9F5', primarySoft: '#23234A', track: '#2A2A34', scrim: 'rgba(0,0,0,0.6)', off: '#2A2A34', offText: '#6B6B78' };
    const c = dark ? D : L;
    const qs = [
      { text: 'Fale um pouco sobre você.', tip: 'Conte quem você é, o que estuda ou fez, e por que essa vaga combina com você. Três frases já bastam.' },
      { text: 'Conte sobre uma vez em que você ajudou alguém a resolver um problema.', tip: 'Use a ordem Situação → O que você fez → Resultado. Pode ser na escola, em casa ou em um trabalho voluntário.' },
      { text: 'Por que você quer trabalhar com atendimento?', tip: 'Fale de algo que você gosta de verdade, como conversar ou resolver dúvidas, e dê um exemplo.' },
      { text: 'Como você lidaria com um cliente irritado?', tip: 'Mostre primeiro o que você faria: ouvir, entender o problema e propor um caminho. Chamar alguém vem depois.' },
      { text: 'Onde você se vê daqui a dois anos?', tip: 'Fale em aprender e crescer na área. Não precisa ter um plano perfeito.' }
    ];
    const s = this.state;
    const answer = s.answers[s.i] || '';
    const empty = answer.trim().length === 0;
    return {
      c,
      num: s.i + 1,
      pct: ((s.i + 1) / 5 * 100) + '%',
      q: qs[s.i],
      answer, len: answer.length, empty,
      fieldBorder: s.focus ? '2px solid ' + c.primary : '1px solid ' + c.border,
      onType: (e) => { const a = s.answers.slice(); a[s.i] = e.target.value; this.setState({ answers: a }); },
      onFocus: () => this.setState({ focus: true }),
      onBlur: () => this.setState({ focus: false }),
      showTip: s.tip,
      toggleTip: () => this.setState({ tip: !s.tip }),
      isLast: s.i === 4, notLast: s.i !== 4,
      sendBg: empty ? c.off : c.primary,
      sendColor: empty ? c.offText : c.onPrimary,
      send: () => { if (!empty) this.setState({ i: Math.min(4, s.i + 1), tip: false }); },
      exit: s.exit,
      openExit: () => this.setState({ exit: true }),
      closeExit: () => this.setState({ exit: false })
    };
  }
}
</script>
</body>
</html>
