<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gerando feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F7F7FB}
.press{transition:transform 180ms ease-out}.press:active{transform:scale(.97)}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-14px);opacity:1}}
.d1{animation:bob 1200ms ease-in-out infinite}
.d2{animation:bob 1200ms ease-in-out 150ms infinite}
.d3{animation:bob 1200ms ease-in-out 300ms infinite}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade 250ms ease-out both}
@media (prefers-reduced-motion: reduce){.d1,.d2,.d3,.fade{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7FB; display: flex; flex-direction: column; align-items: center; font-family: Inter, system-ui, sans-serif; color: #1B1B1F">
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 0 32px; text-align: center">
    <div style="width: 160px; height: 160px; border-radius: 999px; background: #EEEEFC; display: flex; align-items: center; justify-content: center; gap: 14px" aria-hidden="true">
      <span class="d1" style="width: 16px; height: 16px; border-radius: 999px; background: #5B5BD6"></span>
      <span class="d2" style="width: 16px; height: 16px; border-radius: 999px; background: #5B5BD6"></span>
      <span class="d3" style="width: 16px; height: 16px; border-radius: 999px; background: #5B5BD6"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; min-height: 64px" aria-live="polite">
      <divstyle="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 22px; line-height: 28px">{{phrase}}</div>
      <div style="font-size: 14px; line-height: 20px; color: #6B6B76">Isso leva uns segundinhos.</div>
    </div>
  </div>
  <div style="width: 100%; box-sizing: border-box; padding: 0 20px 40px; height: 132px; display: flex; flex-direction: column; justify-content: flex-end">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a class="press fade" href="T09Resultado.dc.html" style="height: 52px; border-radius: 14px; background: #5B5BD6; color: #FFFFFF; font: 600 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Ver meu resultado</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { idx: 0, ticks: 0 }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState((s) => ({ idx: (s.idx + 1) % 3, ticks: s.ticks + 1 }));
    }, 1800);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const phrases = ['Lendo suas respostas…', 'Separando o que ficou bom…', 'Preparando dicas para você…'];
    return { idx: this.state.idx, phrase: phrases[this.state.idx], ready: this.state.ticks >= 3 };
  }
}
</script>
</body>
</html>
